name: Spotify production worker v4

on:
  workflow_dispatch:
  schedule:
    # Keep the 3-hour cadence but use an uncommon minute to avoid the busiest
    # scheduler boundaries and force GitHub to register the schedule afresh.
    - cron: '37 */3 * * *'

permissions:
  contents: read

concurrency:
  group: spotify-production-worker-v4
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run worker
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HEADLESS: 'true'

          # 2,500 artists x 8 scheduled runs = up to 20,000 collection attempts/day.
          MAX_ARTIST_UPDATES_PER_DAY: '50000'
          MAX_PLAYLIST_SCANS_PER_DAY: '800'
          MAX_DISCOVERY_QUERIES_PER_DAY: '160'

          MAX_ARTIST_UPDATES_PER_RUN: '2500'
          MAX_PLAYLIST_SCANS_PER_RUN: '100'
          MAX_DISCOVERY_QUERIES_PER_RUN: '20'

          # Four browser lanes add headroom while the existing randomized delay
          # and retry/backoff logic continue to protect Spotify from bursts.
          BROWSER_CONCURRENCY: '4'
          REQUEST_DELAY_MS: '2200'
          REQUEST_JITTER_MS: '1200'
          PAGE_TIMEOUT_MS: '45000'
          PAGE_SETTLE_MS: '4500'
          MAX_RETRIES: '3'
          RETRY_BASE_DELAY_MS: '5000'
          # Finish before the next 3-hour schedule instead of letting runs queue.
          MAX_RUNTIME_MINUTES: '170'
          ANOMALY_RECHECK_RATIO: '1.5'
          ANOMALY_CONFIRM_TOLERANCE_PERCENT: '1'

          MIN_MONTHLY_LISTENERS: '10000'
          ACTIVE_RECHECK_HOURS: '24'
          BELOW_THRESHOLD_RECHECK_DAYS: '30'
          PLAYLIST_RESCAN_DAYS: '7'

          WORKER_NAME: spotify-production-worker-v4
          LOCK_TTL_MINUTES: '175'
        run: npm run worker
