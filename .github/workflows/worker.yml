name: Spotify production worker v4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/worker.yml'
      - 'src/worker/**'
      - 'src/lib/db.js'
      - 'src/lib/config.js'
      - 'src/lib/spotify.js'
      - 'src/lib/repairs.js'
      - 'src/lib/lifecycle.js'
      - 'sql/**'
  schedule:
    # Queue an hourly run. With cancel-in-progress disabled, a pending run starts
    # promptly after the current collector exits instead of leaving multi-hour gaps.
    - cron: '47 * * * *'

permissions:
  contents: read

concurrency:
  group: spotify-production-worker-v4
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run worker
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HEADLESS: 'true'
          MAX_ARTIST_UPDATES_PER_DAY: '50000'
          MAX_PLAYLIST_SCANS_PER_DAY: '800'
          MAX_DISCOVERY_QUERIES_PER_DAY: '40'
          MAX_ARTIST_UPDATES_PER_RUN: '2500'
          MAX_PLAYLIST_SCANS_PER_RUN: '0'
          MAX_DISCOVERY_QUERIES_PER_RUN: '0'
          MAX_CANDIDATE_UPDATES_PER_RUN: '0'
          ARTIST_COLLECTION_MODE: active_only
          MAX_PLAYLIST_ACTIVE_POOL: '2000'
          CANDIDATE_QUEUE_HIGH_WATERMARK: '40000'
          BACKLOGGED_PLAYLIST_SCANS_PER_RUN: '60'
          PLAYLIST_BACKFILL_PERCENT: '70'
          BROWSER_CONCURRENCY: '10'
          REQUEST_DELAY_MS: '2200'
          REQUEST_JITTER_MS: '1200'
          PAGE_TIMEOUT_MS: '45000'
          PAGE_SETTLE_MS: '4500'
          MAX_RETRIES: '3'
          RETRY_BASE_DELAY_MS: '5000'
          MAX_RUNTIME_MINUTES: '325'
          ANOMALY_RECHECK_RATIO: '1.5'
          ANOMALY_CONFIRM_TOLERANCE_PERCENT: '1'
          MIN_MONTHLY_LISTENERS: '10000'
          ACTIVE_RECHECK_HOURS: '120'
          PLAYLIST_RESCAN_DAYS: '7'
          WORKER_NAME: spotify-production-worker-v4
          LOCK_TTL_MINUTES: '10'
          WORKER_STALE_RUN_MINUTES: '20'
          WORKER_HEARTBEAT_INTERVAL_MS: '60000'
          WORKER_HEARTBEAT_STALE_MINUTES: '15'
        run: npm run worker
